# Docker Environment — crm_probability_from_stage migration (18.0 -> 19.0)
# Target-only (odoo_target + db_target) — source (18.0) baseline already fully
# documented from static code reading (01b_BASELINE_SPEC.md, carried over
# verified [MATCH] from migration_17.0_18.0), no need to spin up a parallel
# 18.0 instance for this project.
#
# Usage:
#   docker compose up -d          # start db + install module, server stays up
#   docker compose logs odoo_target -f
#   docker compose down           # stop (keep volumes)
#   docker compose down -v        # stop + wipe DB (fresh reinstall)

name: crm_probability_from_stage_18_19

services:
  db_target:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - target_db_data:/var/lib/postgresql/data

  odoo_target:
    build:
      context: .
      dockerfile: Dockerfile.target
    shm_size: '2gb'
    depends_on:
      - db_target
    ports:
      - "8178:8069"
    environment:
      HOST: db_target
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ..:/mnt/extra-addons
      - ./logs:/var/log/odoo
      - target_filestore:/var/lib/odoo
    command: >
      odoo -d target_db -i crm_probability_from_stage
      --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
      --logfile=/var/log/odoo/odoo_target.log

volumes:
  target_db_data:
  target_filestore:
