# Docker Environment — crm_probability_from_stage migration (19.0 -> 20.0)
# Target-only (odoo_target + db_target). Odoo 20.0 runs from the native-target source tree
# (D:/Kuncoro/doodex/repo/odoo20, mounted read-only) — no official odoo:20.0 image yet.
#
# Usage (ALWAYS wipe the DB first, otherwise -i on an existing DB silently skips install+tests):
#   docker compose down -v
#   docker compose up --build --abort-on-container-exit odoo_target   # G1/G2: install + test suite
#   docker compose logs odoo_target
#
# Interactive server (Step 10): run without --test-enable/--stop-after-init, e.g.
#   docker compose run --rm --service-ports odoo_target -d target_db -i crm_probability_from_stage \
#     --addons-path=/opt/odoo/addons,/opt/odoo/odoo/addons,/mnt/extra-addons --http-interface=0.0.0.0

name: crm_probability_from_stage_19_20

services:
  db_target:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - target_db_data:/var/lib/postgresql/data

  odoo_target:
    build:
      context: .
      dockerfile: Dockerfile.target
    shm_size: '2gb'
    depends_on:
      - db_target
    ports:
      - "8179:8069"
    environment:
      # libpq variables (the source-run image has no official entrypoint reading HOST/USER/PASSWORD)
      PGHOST: db_target
      PGUSER: odoo
      PGPASSWORD: odoo
    volumes:
      - ../crm_probability_from_stage:/mnt/extra-addons/crm_probability_from_stage
      - ./logs:/var/log/odoo
      - D:/Kuncoro/doodex/repo/odoo20:/opt/odoo:ro
    command: >
      -d target_db
      -i crm_probability_from_stage
      --addons-path=/opt/odoo/addons,/opt/odoo/odoo/addons,/mnt/extra-addons
      --http-interface=0.0.0.0
      --test-enable
      --test-tags=/crm_probability_from_stage
      --stop-after-init
      --logfile=/var/log/odoo/odoo_target.log

volumes:
  target_db_data:
